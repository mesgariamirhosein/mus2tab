<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mus2Tab</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="container">
    <h1>🎸 Mus2Tab</h1>

    <div class="upload-area">
      <input type="file" id="audioInput" accept=".mp3,.wav,.ogg" />
      <button id="analyzeBtn">تحلیل و ساخت تبلچر</button>
    </div>

    <div id="status" class="status"></div>

    <div id="tabContainer">
      <div id="alphaTab"></div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@coderline/alphatab@1/dist/alphaTab.min.js"></script>
  <script src="main.js"></script>
</body>
</html>
